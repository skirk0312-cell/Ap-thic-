<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apéthic Store - Joki Genshin Impact</title>
    <meta name="description" content="Apethix Joki menyediakan jasa joki genshin impact terpercaya.">
    <link rel="stylesheet" href="Desain.css">

    <!-- Favicon Logo Brand -->
    <link rel="icon" type="image/png" href="asset/images/New Project 59 [660D602].png">

    <!-- Meta Open Graph untuk Nama Website -->
    <meta property="og:site_name" content="Apéthic Store" />
    <meta property="og:title" content="Apéthic Store - Joki Genshin Impact" />
    <meta property="og:image" content="asset/images/New Project 59 [660D602].png" />

    <!-- Schema Structured Data untuk Google Site Name -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Apéthic Store",
      "alternateName": ["Apethix", "Apethix Joki", "Apéthic"],
      "url": "https://apethix.vercel.app/"
    }
    </script>
</head>
<body>

    <!-- Header & Hero Banner -->
    <header class="banner-header-wrapper">
        <img src="asset/images/genshin-impact-odette-kit-and-release-date-cover-1600x900.webp" alt="Banner Utama Natlan" class="banner-img">

        <div class="brand-container">

            <p class="section-subtitle">Pengerjaan 100% Manual Tanpa Cheat ♡</p>
        </div>

        <div class="catalog-grid">

            <!-- Katalog 1 -->
            <a href="explore.html" class="catalog-card">
                <div class="card-image-wrapper">
                    <img src="asset/images/speculative-map-of-natlan-v0-knvcn194ifld1.jpg" alt="Joki Explore">
                    <div class="card-glow"></div>
                </div>
                <div class="card-caption">
                    <h3>☆Joki Explore♡</h3>
                </div>
            </a>

            <!-- Katalog 2 -->
            <a href="quest.html" class="catalog-card">
                <div class="card-image-wrapper">
                    <img src="asset/images/varesa-banner-1.webp" alt="Joki Quest">
                    <div class="card-glow"></div>
                </div>
                <div class="card-caption">
                    <h3>☆Joki Quest♡</h3>
                </div>
            </a>

            <!-- Katalog 3 -->
            <a href="#" class="catalog-card">
                <div class="card-image-wrapper">
                    <img src="asset/images/genshin_impact_xilonen_guide_build_copetina.webp" alt="Joki Rawat Akun">
                    <div class="card-glow"></div>
                </div>
                <div class="card-caption">
                    <h3>♡Joki Rawat Akun☆</h3>
                </div>
            </a>

            <!-- Katalog 4 -->
            <a href="#" class="catalog-card">
                <div class="card-image-wrapper">
                    <img src="asset/images/h2jteb88vfdf1.png" alt="Joki Event">
                    <div class="card-glow"></div>
                </div>
                <div class="card-caption">
                    <h3>♡Joki Event☆</h3>
                </div>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <!-- Left: Contact WA -->
            <a href="https://wa.me/6281521650773" target="_blank" class="whatsapp-link">
                <svg class="phone-icon" viewBox="0 0 24 24">
                    <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                <span>Question? Contact WA</span>
            </a>

            <!-- Center: Copyright -->
            <div class="copyright">
                ©2026 Apéthic
            </div>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
